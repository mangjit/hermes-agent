# Render Blueprint — Hermes Agent gateway as a free Docker web service.
# Docs: docs/RENDER_DEPLOYMENT.md
#
# In Render: New + → Blueprint → pick this repo + the branch → Render reads
# this file and builds the image from render/Dockerfile (all Python deps,
# including aiohttp, are baked into the image — no native build command to
# drift out of sync).
#
# Free plan limitations (sleeps after 15 min idle, 512 MB RAM, ephemeral disk)
# make this suitable for the HTTP API server, NOT for an always-on
# Telegram/Discord polling bot — see the doc for details.

services:
  - type: web
    name: hermes-agent-api
    runtime: docker
    plan: free
    region: oregon
    # No `branch:` pin — Render deploys the branch you select when creating
    # the Blueprint (change it later under Settings → Build & Deploy).
    dockerfilePath: render/Dockerfile
    dockerContext: .
    # No dockerCommand: the image CMD is `bash render/start.sh`.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render generates a strong random key at blueprint creation.
      # Used as the Bearer token for the OpenAI-compatible API.
      - key: API_SERVER_KEY
        generateValue: true
      # Required even though start.sh exports it, so it shows in the dashboard.
      - key: API_SERVER_HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
      # ── Model provider keys ──────────────────────────────────────────────
      # `sync: false` = set the value in the Render dashboard (never committed).
      # You only need the key(s) for the provider(s) configured in
      # render/config.yaml (default: NVIDIA NIM). Add more rows here if you
      # use model_routes to serve several providers at once.
      #
      # NVIDIA NIM — https://build.nvidia.com (key starts with nvapi-)
      - key: NVIDIA_API_KEY
        sync: false
      # OpenRouter — https://openrouter.ai/keys (free ":free" models)
      - key: OPENROUTER_API_KEY
        sync: false
      # Other providers (uncomment the ones you use):
      # - key: OPENAI_API_KEY
      #   sync: false
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: GOOGLE_API_KEY
      #   sync: false
      # - key: GROQ_API_KEY
      #   sync: false
      # - key: DEEPSEEK_API_KEY
      #   sync: false
      # - key: XAI_API_KEY
      #   sync: false
      #
      # If you deploy the web/ dashboard as a static site (see docs), put its
      # URL here, e.g. https://hermes-dashboard.onrender.app
      # - key: API_SERVER_CORS_ORIGINS
      #   sync: false
