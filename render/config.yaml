# Minimal headless Hermes config for a Render web service.
# Copied into $HERMES_HOME/config.yaml on first boot by render/start.sh
# (free tier = ephemeral disk, so it re-seeds on every deploy/cold start).
#
# SECRETS NEVER GO HERE — provider keys are read from environment variables
# (set them in Render → your service → Environment). This file only says
# WHICH provider/model to use.

# ─────────────────────────────────────────────────────────────────────────────
# OpenRouter — ACTIVE DEFAULT (free models work with OPENROUTER_API_KEY)
# Get a key: https://openrouter.ai/keys  ·  free models: ?max_price=0
# ─────────────────────────────────────────────────────────────────────────────
model:
  default: "meta-llama/llama-3.3-70b-instruct:free"
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"   # optional; this is the default

# ─────────────────────────────────────────────────────────────────────────────
# Other providers — comment out the OpenRouter block above and uncomment one,
# then add the matching env var in Render.
# ─────────────────────────────────────────────────────────────────────────────
#
# --- NVIDIA NIM (build.nvidia.com; key starts with nvapi-) ---
# env var: NVIDIA_API_KEY     browse model ids: https://build.nvidia.com/models
#
# model:
#   default: "nvidia/nemotron-3.5-lightning-30b-a3b"
#   provider: "nvidia"
#   base_url: "https://integrate.api.nvidia.com/v1"
#
# --- OpenAI ---   env var: OPENAI_API_KEY
# model:
#   default: "gpt-4o"
#   provider: "openai-api"
#   base_url: "https://api.openai.com/v1"
#
# --- Anthropic ---   env var: ANTHROPIC_API_KEY
# model:
#   default: "claude-sonnet-4-5"
#   provider: "anthropic"
#   base_url: "https://api.anthropic.com"
#
# --- Google AI Studio (Gemini) ---   env var: GOOGLE_API_KEY (or GEMINI_API_KEY)
# model:
#   default: "gemini-2.5-pro"
#   provider: "gemini"
#   base_url: "https://generativelanguage.googleapis.com/v1beta"
#
# --- Groq (very fast, free tier) ---   env var: GROQ_API_KEY
# model:
#   default: "llama-3.3-70b-versatile"
#   provider: "groq"
#   base_url: "https://api.groq.com/openai/v1"
#
# --- DeepSeek ---   env var: DEEPSEEK_API_KEY
# model:
#   default: "deepseek-chat"
#   provider: "deepseek"
#   base_url: "https://api.deepseek.com/v1"
#
# --- xAI (Grok) ---   env var: XAI_API_KEY
# model:
#   default: "grok-4"
#   provider: "xai"
#   base_url: "https://api.x.ai/v1"
#
# --- Any other OpenAI-compatible endpoint (vLLM, Together, Fireworks, local NIM...) ---
# model:
#   default: "your-model-id"
#   provider: "custom"
#   base_url: "https://your-host/v1"

# ─────────────────────────────────────────────────────────────────────────────
# MULTI-PROVIDER for mode=api (optional): expose providers behind aliases.
# Clients pick the alias in the "model" field; the gateway routes to the named
# provider using its key from the environment (set all keys in Render).
# ─────────────────────────────────────────────────────────────────────────────
#
